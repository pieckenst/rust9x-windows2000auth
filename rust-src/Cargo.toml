[package]
name = "rust9x_windows_auth"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust9x_windows_auth"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust9x_auth_test"
path = "src/bin/test_harness.rs"

[features]
default = ["network", "tls", "std"]
network = []
tls = ["native-tls"]
std = []
# Enable for Windows 9x/ME - requires unicows
unicows = []
# Build flags for DLL (static CRT - no MSVCR dependency on target)
dll-build = []
# Build flags for EXE (dynamic CRT - avoids duplicate symbols)
exe-build = []
# Build flags for EXE (static CRT - no MSVCR dependency on target)
exe-static-build = []

[dependencies]
sspi = "0.21"
native-tls = { path = "../rust-native-tls-src", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"], optional = true }
base64 = "0.21"

[build-dependencies]
winres = "0.1"
embed-resource = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Authentication", "Win32_Security_Authentication_Identity", "Win32_Graphics_Gdi", "Win32_System_Diagnostics", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = true

# DLL-specific profiles with static CRT (no MSVCR dependency on target)
[profile.dll-dev]
inherits = "dev"
panic = "abort"

[profile.dll-release]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
debug = true

# EXE-specific profiles with dynamic CRT (avoids duplicate symbols)
[profile.exe-dev]
inherits = "dev"
panic = "abort"

[profile.exe-release]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
debug = true
