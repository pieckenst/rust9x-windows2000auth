[unstable]
# using build-std will allow for smaller binaries (only include what you use)
#
# build-std = ["std"]

# `optimize_for_size` replaces some size-expensive algorithms with smaller ones (sorting, int parsing,
# ...)
#
# build-std-features = ["backtrace", "optimize_for_size"]

[build]

[target.'cfg(all(target_env = "msvc"))']
linker = "rust-lld"
# you might want this if you're building on linux
# runner = "wine"

[target.'cfg(all(target_family = "rust9x", target_env = "msvc"))']
rustflags = [
  # Show linker args for debugging purposes
  # '--print=link-args',

  # IMPORTANT: the next two link args will ONLY work with rust-lld, not with a modern MSVC link.exe!
  # if you can't use rust-lld for some reason, you'll need to add a post-compile step to use
  # `editbin.exe` to set these instead: `editbin.exe /SUBSYSTEM:... /OSVERSION:...`
  # editbin will warn, but still do it.
  #
  # set subsystem to WINDOWS or CONSOLE, with version 4.0 (Windows 95 and up, NT3.5 and up)
  # set version 3.10 (_not_ 3.1) for Windows NT 3.1
  '-Clink-arg=/SUBSYSTEM:CONSOLE,4.0',
  '-Clink-arg=/OSVERSION:3.1',         # set OS version to 3.1 to work anywhere

  # (NOTE: NT3.51 does _not_ like a 1MiB stack and will promptly ignore it)
  '-Clink-arg=/STACK:131072', # 128KiB stack

  # no manifest  inclusion -  optional for testing the  build  
  '-Clink-arg=/MANIFEST:NO',

  ############# Add search paths for import libraries

  # rust9x links against `unicows.lib` by default, make sure it's in your search path.
  '-Clink-arg=C:\\Program Files\\Microsoft Platform SDK\\Lib\\unicows.lib',
  # If you don't want to use `unicows.lib` (you're not targeting Windows 9x/Me), you can disable it:
  # '-Zunicows=no',

  # # r9xrsrt: all windows, no C support, no unwinding, no float math library
  # '-Clink-arg=/LIBPATH:/home/seri/p/rust/rust9x/r9xrsrt/target/i586-rust9x-windows-msvc/release',
  # '-Clink-arg=kernel32.lib',

  # # VC6: Stdlib doesn't support SAFESEH, panic = "abort" mandatory, unwinding fails
  # '-Clink-arg=/SAFESEH:NO',
  # '-Clink-arg=/LIBPATH:/home/seri/mnt/ext4/msvc-toolchains/vc6/VC98/Lib',

  # # VC7.1: Win95 support, panic = "abort" mandatory, unwinding fails
  # '-Clink-arg=/LIBPATH:/home/seri/mnt/ext4/msvc-toolchains/vc71/Vc7/lib',
  # '-Clink-arg=/LIBPATH:/home/seri/mnt/ext4/msvc-toolchains/vc71/Vc7/PlatformSDK/Lib',
  # # necessary for rust-lld, as it doesn't like the old pdb format used by VC7.1
  # '-Clink-arg=/DEBUG:NONE',

  # VC8: Win98+/NT4 support, panic unwinding works
  '-Clink-arg=/LIBPATH:E:\\vs2005\\VC\\lib',
  '-Clink-arg=/LIBPATH:E:\\vs2005\\VC\\PlatformSDK\\Lib',

  # # Any newer version of the toolsets should work just as well! Use e.g. the MSVC2017 XP toolset
  # # for the most modern XP support.
  # '-Clink-arg=/LIBPATH:/home/seri/mnt/ext4/msvc-toolchains/vs2022-2017-xp/BuildTools/VC/Tools/MSVC/14.16.27023/lib/x86',
  # '-Clink-arg=/LIBPATH:/home/seri/mnt/ext4/msvc-toolchains/vs2022-2017-xp/Microsoft SDKs/Windows/v7.1A/Lib',

  # # Add modern universal CRT for missing float/math intrinsics. see `cfg(feature = "float")` in
  # # `main.rs`!
  # '-Clink-arg=libucrt.lib',
]

# DLL-specific configuration: use static CRT for DLL (no MSVCR dependency on target)
# Use via: cargo build --features dll-build
[target.'cfg(all(target_family = "rust9x", target_env = "msvc", feature = "dll-build"))']
rustflags = [
  '-Ctarget-feature=+crt-static', # statically linked runtime (no MSVCR dependency)
  '-Clink-arg=/NODEFAULTLIB:msvcrt.lib', # prevent dynamic CRT
  '-Clink-arg=/NODEFAULTLIB:msvcrtd.lib', # prevent debug dynamic CRT
  '-Clink-arg=libcmt.lib', # explicitly link static CRT
]

# EXE-specific configuration: use dynamic CRT for EXE (avoids duplicate symbols)
# Use via: cargo build --features exe-build
[target.'cfg(all(target_family = "rust9x", target_env = "msvc", feature = "exe-build"))']
rustflags = [
  '-Ctarget-feature=-crt-static', # dynamically linked runtime
]

# EXE-specific configuration: use static CRT for EXE (no MSVCR dependency on target)
# Use via: cargo build --features exe-static-build
[target.'cfg(all(target_family = "rust9x", target_env = "msvc", feature = "exe-static-build"))']
rustflags = [
  '-Ctarget-feature=+crt-static', # statically linked runtime (no MSVCR dependency)
  '-Clink-arg=/NODEFAULTLIB:msvcrt.lib', # prevent dynamic CRT
  '-Clink-arg=/NODEFAULTLIB:msvcrtd.lib', # prevent debug dynamic CRT
  '-Clink-arg=libcmt.lib', # explicitly link static CRT
]

# Additional link args for Windows Auth DLL (needs secur32.lib for SSPI/NTLM)
[target.'cfg(all(target_family = "rust9x", target_env = "msvc", feature = "network"))']
rustflags = [
  '-Clink-arg=secur32.lib',
  '-Clink-arg=ws2_32.lib',
]

# Build aliases with separate output directories for each variant
[alias]
# DLL build with static CRT
dll-release = ["build", "--target", "i686-rust9x-windows-msvc", "--release", "--features", "dll-build,network,tls", "--target-dir", "target/dll-release"]
dll-debug = ["build", "--target", "i686-rust9x-windows-msvc", "--features", "dll-build,network,tls", "--target-dir", "target/dll-debug"]

# EXE build with dynamic CRT
exe-release = ["build", "--target", "i686-rust9x-windows-msvc", "--bin", "rust9x_auth_test", "--release", "--features", "exe-build,network,tls", "--target-dir", "target/exe-release"]
exe-debug = ["build", "--target", "i686-rust9x-windows-msvc", "--bin", "rust9x_auth_test", "--features", "exe-build,network,tls", "--target-dir", "target/exe-debug"]

# EXE build with static CRT
exe-static-release = ["build", "--target", "i686-rust9x-windows-msvc", "--bin", "rust9x_auth_test", "--release", "--features", "exe-static-build,network,tls", "--target-dir", "target/exe-static-release"]
exe-static-debug = ["build", "--target", "i686-rust9x-windows-msvc", "--bin", "rust9x_auth_test", "--features", "exe-static-build,network,tls", "--target-dir", "target/exe-static-debug"]
